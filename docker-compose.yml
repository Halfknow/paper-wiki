# PaperWiki v3 部署：app + postgres（生产），postgres-test（测试，profile 隔离）
#
# 双 PG 设计（生产 vs 测试隔离，避免测试污染真实数据）：
#   - postgres      生产库，端口 25432，持久卷 pgdata，存真实论文。`docker compose up` 默认启动。
#   - postgres-test 测试库，端口 15432，无持久卷（每次重建），存 e2e 假数据。profile=test 隔离，
#                   仅 `docker compose --profile test up -d postgres-test` 时启动；跑 npm run test:e2e 前用它。
#
# 用法：
#   cp .env.example .env 并填写 → docker compose up -d --build
#   迁移旧 JSON：docker compose run --rm -v ./data:/legacy-data app node scripts/migrate-json-to-pg.js /legacy-data
#   跑 e2e/本地开发测试：docker compose --profile test up -d postgres-test && npm run test:e2e
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8888}:8888' # 保持仅本机可访问（无鉴权，勿暴露局域网/公网）
    environment:
      DATABASE_URL: postgres://paperwiki:${POSTGRES_PASSWORD}@postgres:5432/paperwiki
    volumes:
      - '${PAPERS_ROOT}:/papers' # Windows 论文根目录挂载（读写：扫描改名/导入下载/删除）
      - './config.json:/app/config.json:ro' # AI key 等业务配置
      - 'backups:/app/backups' # 每日 JSON 快照（PG→JSON 逃生通道）
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8888/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperwiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperwiki
    ports:
      - '25432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperwiki -d paperwiki']
      interval: 5s
      timeout: 3s
      retries: 20

  # 测试专用 PG —— 与生产 postgres 完全隔离（独立端口/无持久卷/密码 dev）。
  # profiles: [test] 让它默认不启动，只在 `docker compose --profile test up` 时拉起。
  # 用途：① e2e 测试（npm run test:e2e 前启动，注入假 sample + 高亮往返，不污染生产 156 篇）
  #       ② 本地 node server.js 开发调试（DATABASE_URL 指向 15432，避免误连生产）。
  # 数据不持久（容器删了即丢），适合反复重置的测试场景。
  postgres-test:
    image: postgres:16-alpine
    profiles: ['test']
    restart: 'no' # 测试用，不自动重启
    environment:
      POSTGRES_USER: paperwiki
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: paperwiki
    ports:
      - '127.0.0.1:15432:5432' # playwright.config.js / e2e-bootstrap.js 默认连此端口
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperwiki -d paperwiki']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  backups:

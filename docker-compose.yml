# PaperWiki v3 生产部署：app + postgres
# 用法：cp .env.example .env 并填写 → docker compose up -d --build
# 迁移旧 JSON 数据：docker compose run --rm -v ./data:/legacy-data app node scripts/migrate-json-to-pg.js /legacy-data
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8888}:8888' # 保持仅本机可访问（无鉴权，勿暴露局域网/公网）
    environment:
      DATABASE_URL: postgres://paperwiki:${POSTGRES_PASSWORD}@postgres:5432/paperwiki
    volumes:
      - '${PAPERS_ROOT}:/papers' # Windows 论文根目录挂载（读写：扫描改名/导入下载/删除）
      - './config.json:/app/config.json:ro' # AI key 等业务配置
      - 'backups:/app/backups' # 每日 JSON 快照（PG→JSON 逃生通道）
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8888/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperwiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperwiki
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperwiki -d paperwiki']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  backups:
